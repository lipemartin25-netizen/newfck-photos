name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt || true
          python -m pip install pytest
      - name: Run backend tests
        run: |
          cd backend
          python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build
name: CI - Lint & Test Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Backend Checks
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Backend Deps
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov bandit semgrep
          
      - name: Run Bandit (Security Linter)
        run: bandit -r backend/app -ll
        
      - name: Run Pytest
        run: |
          cd backend
          pytest --cov=app --cov-report=xml
          
      # Frontend Checks
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
          
      - name: Install Frontend Deps
        run: |
          cd frontend
          npm ci
          
      - name: Run Eslint
        run: |
          cd frontend
          npm run lint
